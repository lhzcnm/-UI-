<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="shortcut icon" href="%VITE_APP_MODE%/favicon.png" type="image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC&family=Noto+Serif+SC&display=swap" rel="stylesheet">
  <title>%VITE_APP_NAME%</title>
  <script>
  ;(function initTheme() {
    const html = document.documentElement
    const storedTheme = localStorage.getItem('theme')
    const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches
    let applyTheme = storedTheme || (systemTheme ? 'dark' : 'light')
    storedTheme && localStorage.setItem('theme', applyTheme)

    const isLogined = localStorage.getItem('%VITE_ACCESS_TOKEN%')
    const isAuth = !isLogined || location.pathname.includes('/auth')
    if (isAuth) applyTheme = 'light'

    html.classList.add(applyTheme)
  })()
  </script>
</head>
<body class="noto-sans-sc">
  <div id="app"></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="shortcut icon" href="%VITE_APP_MODE%/favicon.png" type="image">
  <title>%VITE_APP_NAME%</title>
  <script>
  ;(function initTheme() {
    const html = document.documentElement
    const storedTheme = localStorage.getItem('theme')
    const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches
    let applyTheme = storedTheme || (systemTheme ? 'dark' : 'light')
    storedTheme && localStorage.setItem('theme', applyTheme)

    if (location.pathname.includes('/auth')) {
      applyTheme = 'light'
    }

    html.setAttribute('data-ag-theme-mode', applyTheme)
    html.classList.add(applyTheme)
  })()
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>

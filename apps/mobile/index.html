<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline'">
  <link rel="shortcut icon" href="/favicon.png" type="image">
  <meta name="author" content="深圳市陆深三和科技有限公司">
  <meta name="keywords" content="三和查询,陆深三和,解锁,查询,批量查询,IMEI" />
  <meta name="description" content="十年老站，为手机维修人员提供解锁、批量查询服务。">
  <title>%VITE_APP_NAME%</title>
  <script>
  ;(function initTheme() {
    const html = document.documentElement
    const storedTheme = localStorage.getItem('3un-theme')
    const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches
    const applyTheme = storedTheme || (systemTheme ? 'dark' : 'light')

    localStorage.setItem('3un-theme', applyTheme)
    html.classList.add(applyTheme)
  })()
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>

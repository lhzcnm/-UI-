<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>%VITE_APP_NAME%</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #e6f3ff 0%, #f0f4f5 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 400px;
      margin: 20px;
      padding: 32px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      animation: fadeIn 0.5s ease-in-out;
    }

    .success-icon {
      width: 60px;
      height: 60px;
      margin: 0 auto 20px;
      background: #16a34a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 32px;
      font-weight: bold;
    }

    h1 {
      font-size: 24px;
      color: #16a34a;
      text-align: center;
      margin-bottom: 16px;
      font-weight: 600;
    }

    .info {
      text-align: center;
      color: #666;
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      background: #1677ff;
      color: white;
      text-align: center;
      border-radius: 8px;
      text-decoration: none;
      font-size: 16px;
      font-weight: 500;
      transition: background 0.3s;
    }

    .btn:hover {
      background: #0958d9;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 480px) {
      .container {
        margin: 15px;
        padding: 24px;
      }
      h1 {
        font-size: 20px;
      }
      .success-icon {
        width: 50px;
        height: 50px;
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="success-icon">✓</div>
    <h1>支付成功</h1>
    <div class="info">感谢您的支付<br>请返回公众号主页查看详情</div>
    <a href="/" class="btn">返回主页</a>
  </div>
</body>
</html>
